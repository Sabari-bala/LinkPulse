<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LinkPulse</title>
    <link rel="stylesheet" href="/static/css/style.css?v=15">
    <link rel="stylesheet" href="/static/css/auth.css?v=15">
    <link rel="stylesheet" href="/static/css/responsive.css?v=15">
</head>
<body>
    <header>
        <a href="/" class="logo">LinkPulse</a>
        <nav>
            <a href="/">Home</a>
            <a href="/register/">Register</a>
        </nav>
    </header>
    <main>
        <div class="auth-form">
            <h2>Welcome back</h2>
            <p class="auth-subtitle">Log in to manage your links</p>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Log In</button>
                <div id="message" class="mt-2"></div>
            </form>
            <div class="form-footer">
                Don't have an account? <a href="/register/">Register</a>
            </div>
        </div>
    </main>
    <script src="/static/js/api.js?v=15"></script>
    <script src="/static/js/ui.js?v=15"></script>
    <script src="/static/js/auth.js?v=15"></script>
</body>
</html>
