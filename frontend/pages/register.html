<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LinkPulse</title>
    <link rel="stylesheet" href="/static/css/style.css?v=15">
    <link rel="stylesheet" href="/static/css/auth.css?v=15">
    <link rel="stylesheet" href="/static/css/responsive.css?v=15">
</head>
<body>
    <header>
        <a href="/" class="logo">LinkPulse</a>
        <nav>
            <a href="/">Home</a>
            <a href="/login/">Login</a>
        </nav>
    </header>
    <main>
        <div class="auth-form">
            <h2>Create account</h2>
            <p class="auth-subtitle">Start shortening links in seconds</p>
            <form id="register-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="password2">Confirm Password</label>
                    <input type="password" id="password2" placeholder="Confirm password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Register</button>
                <div id="message" class="mt-2"></div>
            </form>
            <div class="form-footer">
                Already have an account? <a href="/login/">Login</a>
            </div>
        </div>
    </main>
    <script src="/static/js/api.js?v=15"></script>
    <script src="/static/js/ui.js?v=15"></script>
    <script src="/static/js/auth.js?v=15"></script>
</body>
</html>
