<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LinkPulse</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3"><link rel="stylesheet" href="/static/css/auth.css?v=3"><link rel="stylesheet" href="/static/css/dashboard.css?v=3"><link rel="stylesheet" href="/static/css/responsive.css?v=3">
</head>
<body>
    <header>
        <a href="/" style="text-decoration:none;color:inherit;"><h1>LinkPulse</h1></a>
        <nav><a href="/">Home</a>
            <a href="/login/">Login</a>
        </nav>
    </header>
    <main>
        <h2>Register</h2>
        <form id="register-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <input type="password" id="password2" placeholder="Confirm Password" required>
            <button type="submit">Register</button>
        </form>
        <div id="message"></div>
    </main>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
