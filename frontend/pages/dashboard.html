<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ShortMetric</title>
    <link rel="stylesheet" href="/static/css/style.css?v=19">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=19">
    <link rel="stylesheet" href="/static/css/responsive.css?v=19">
</head>
<body>
    <header>
        <a href="/" class="logo">ShortMetric</a>
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard/" class="active">Dashboard</a>
            <a href="/create-link/">Create Link</a>
            <a href="/analytics/">Analytics</a>
            <a href="/profile/">Profile</a>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>
    <main>
        <div class="flex items-center justify-between mb-3">
            <div>
                <h1 style="margin:0;">Good morning, <span id="welcome-user"></span></h1>
                <p class="text-muted" style="margin:0;">Here's what's happening with your links.</p>
            </div>
            <a href="/create-link/" class="btn">+ Create Link</a>
        </div>

        <div class="stats-grid" id="stats-container">
            <!-- Stats cards will be inserted by JS -->
        </div>

        <div class="flex gap-2 mb-2" style="flex-wrap:wrap; align-items:center;">
            <input type="text" id="link-search" placeholder="Search by short code or URL" style="flex:1; min-width:200px; max-width:400px;">
            <select id="status-filter" style="max-width:150px;">
                <option value="">All Status</option>
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
                <option value="expired">Expired</option>
            </select>
            <select id="sort-links" style="max-width:150px;">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="clicks">Most Clicks</option>
            </select>
        </div>

        <h2>My Links</h2>
        <div id="links-container">Loading your links...</div>
        <div id="pagination-controls" class="flex gap-2 mt-2" style="justify-content:center;"></div>
    </main>
    <script src="/static/js/api.js?v=19"></script>
    <script src="/static/js/ui.js?v=19"></script>
    <script src="/static/js/dashboard.js?v=19"></script>
</body>
</html>
