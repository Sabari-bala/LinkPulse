<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - LinkPulse</title>
    <link rel="stylesheet" href="/static/css/style.css?v=15">
    <link rel="stylesheet" href="/static/css/dashboard.css?v=15">
    <link rel="stylesheet" href="/static/css/responsive.css?v=15">
</head>
<body>
    <header>
        <a href="/" class="logo">LinkPulse</a>
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard/" class="active">Dashboard</a>
            <a href="/create-link/">Create Link</a>
            <a href="/analytics/">Analytics</a>
            <a href="/profile/">Profile</a>
            <a href="#" id="logout-btn">Logout</a>
        </nav>
    </header>
    <main>
        <div class="flex items-center justify-between mb-3">
            <div>
                <h1 style="margin:0;">Good morning, <span id="welcome-user"></span></h1>
                <p class="text-muted" style="margin:0;">Here's what's happening with your links.</p>
            </div>
            <a href="/create-link/" class="btn">+ Create Link</a>
        </div>
        <div class="stats-grid" id="stats-container">
            <!-- Stats cards will be inserted by JS -->
        </div>
        <div class="mb-2">
            <input type="text" id="link-search" placeholder="Search by short code or original URL" style="max-width:300px;">
        </div>
        <h2>My Links</h2>
        <div id="links-container">Loading your links...</div>
    </main>
    <script src="/static/js/api.js?v=15"></script>
    <script src="/static/js/ui.js?v=15"></script>
    <script src="/static/js/dashboard.js?v=15"></script>
</body>
</html>
